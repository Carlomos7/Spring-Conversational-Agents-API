spring:
  application:
    name: conversational-agents

  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate       # Flyway owns schema everywhere

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # baseline-on-migrate: true   # uncomment if migrating an existing DB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# LangChain4j
langchain4j:
  open-ai:
    provider: ${OPENAI_PROVIDER:openai}
    chat-model:
      # Mandatory parameters
      api-key: ${OPENAI_API_KEY}
      model-name: ${OPENAI_MODEL}

      # Optional parameters
      base-url: ${OPENAI_BASE_URL}
      strict-tools: ${OPENAI_STRICT_TOOLS:true}
      temperature: ${OPENAI_TEMPERATURE:0.2}
      log-requests: ${OPENAI_LOG_REQUESTS:false}
      log-responses: ${OPENAI_LOG_RESPONSES:false}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
